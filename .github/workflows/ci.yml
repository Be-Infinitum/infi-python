name: ci

# The package is generated from the contract (ADR 0055). This workflow proves three things:
#   1. src/beinfi/_generated/ is exactly what the generator produces from api/openapi.sdk.json;
#   2. types, transport tests and build pass;
#   3. the examples run against the real sandbox, never against a fake
#      (ADR 0055, D7.4). Without the secret, step 3 fails: there is no "passed" without a backend.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generated-and-unit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      - name: src/beinfi/_generated/ matches the contract
        run: make check-generated
      - name: Types (src, examples and type proof)
        run: make typecheck
      - run: make test
      - run: make build

  # The code runs on Python 3.9+; mypy and the generator require 3.11+, so only pytest here.
  unit-python:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --frozen
      - run: uv run pytest

  sandbox:
    # The examples are the suite against the real backend. A PR coming from a fork does not
    # get the secret; in that case the reviewer runs the workflow by hand after the merge.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    needs: generated-and-unit
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    concurrency:
      # One run at a time in this repo. A concurrency group does not reach the
      # other SDK repos, so each one needs its own sandbox account in
      # INFI_SANDBOX_SECRET_KEY; on a shared account their runs race.
      group: sandbox-examples
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      - name: Examples against api-sandbox.beinfi.com
        env:
          INFI_SECRET_KEY: ${{ secrets.INFI_SANDBOX_SECRET_KEY }}
        run: make examples
